services:
  gitea-mcp:
    build: .
    container_name: ${MCP_CONTAINER_NAME:-gitea-mcp}
    restart: unless-stopped
    environment:
      GITEA_URL: ${GITEA_URL}
      GITEA_TOKEN: ${GITEA_TOKEN}
      MCP_HTTP_TOKEN: ${MCP_HTTP_TOKEN}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8101}:8000"
